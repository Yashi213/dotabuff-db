version: '3.8'
services:
  etcd1: &etcd
      image: patroni
      networks: [ app-network ]
      environment:
        ETCD_LISTEN_PEER_URLS: http://0.0.0.0:2380
        ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
        ETCD_INITIAL_CLUSTER: etcd1=http://etcd1:2380,etcd2=http://etcd2:2380,etcd3=http://etcd3:2380
        ETCD_INITIAL_CLUSTER_STATE: new
        ETCD_INITIAL_CLUSTER_TOKEN: tutorial
        ETCD_UNSUPPORTED_ARCH: arm64
      container_name: demo-etcd1
      hostname: etcd1
      command: etcd --name etcd1 --initial-advertise-peer-urls http://etcd1:2380

  etcd2:
      <<: *etcd
      container_name: demo-etcd2
      hostname: etcd2
      command: etcd --name etcd2 --initial-advertise-peer-urls http://etcd2:2380

  etcd3:
      <<: *etcd
      container_name: demo-etcd3
      hostname: etcd3
      command: etcd --name etcd3 --initial-advertise-peer-urls http://etcd3:2380

  haproxy:
      image: patroni
      networks: [ app-network ]
      env_file: patroni.env
      hostname: haproxy
      container_name: demo-haproxy
      ports:
        - "15000:5000"
        - "15001:5001"
      command: haproxy
      environment: &haproxy_env
        ETCDCTL_ENDPOINTS: http://etcd1:2379,http://etcd2:2379,http://etcd3:2379
        PATRONI_ETCD3_HOSTS: "'etcd1:2379','etcd2:2379','etcd3:2379'"
        PATRONI_SCOPE: patroni

  patroni1:
      image: patroni
      networks: [ app-network ]
      env_file: patroni.env
      hostname: patroni1
      container_name: demo-patroni1
      environment:
        <<: *haproxy_env
        PATRONI_NAME: patroni1

  patroni2:
      image: ${PATRONI_TEST_IMAGE:-patroni}
      networks: [ app-network ]
      env_file: patroni.env
      hostname: patroni2
      container_name: demo-patroni2
      environment:
        <<: *haproxy_env
        PATRONI_NAME: patroni2

  patroni3:
      image: ${PATRONI_TEST_IMAGE:-patroni}
      networks: [ app-network ]
      env_file: patroni.env
      hostname: patroni3
      container_name: demo-patroni3
      environment:
        <<: *haproxy_env
        PATRONI_NAME: patroni3

  initdb:
    image: postgres:16-alpine
    container_name: initdb
    networks: [ app-network ]
    env_file:
      - patroni.env
      - .env
    depends_on:
      haproxy:
        condition: service_started
    environment:
      PGHOST: haproxy
      PGPORT: '5000'
      PGUSER: ${PATRONI_SUPERUSER_USERNAME:-postgres}
      PGPASSWORD: ${PATRONI_SUPERUSER_PASSWORD:-postgres}
    entrypoint:
      - /bin/sh
      - -c
      - |
        echo 'Waiting for PostgreSQL cluster…';
        until pg_isready -h "$PGHOST" -p "$PGPORT" -U "$PGUSER"; do sleep 2; done;
        echo 'Cluster is ready.';
        # Проверяем, существует ли analytics_db
        if psql -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" -tAc "SELECT 1 FROM pg_database WHERE datname='analytics_db'" | grep -q 1; then
          echo 'Database analytics_db already exists, skipping creation.';
        else
          echo 'Creating database analytics_db…';
          psql -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" -c "CREATE DATABASE analytics_db;";
        fi


  flyway:
    image: flyway/flyway:latest
    container_name: flyway_migrations
    restart: on-failure
    networks:
      - app-network
    depends_on:
      initdb:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      - FLYWAY_PLACEHOLDERS_DB_ADMIN_USER=${DB_ADMIN_USER}
      - FLYWAY_PLACEHOLDERS_DB_ADMIN_PASSWORD=${DB_ADMIN_PASSWORD}
      - FLYWAY_PLACEHOLDERS_DB_NAME=${DB_NAME}
    volumes:
      - ./migrations:/flyway/sql
    command: >
      -url=jdbc:postgresql://haproxy:5000/${DB_NAME}
      -user=${DB_ADMIN_USER}
      -password=${DB_ADMIN_PASSWORD}
      migrate

  seeder:
    image: python:3.10-slim
    networks: [ app-network ]
    container_name: db_seeder
    depends_on:
      flyway:
        condition: service_completed_successfully
    env_file:
      - .env
      - patroni.env
    volumes:
      - ./seeds:/app
      - ./seeds/requirements.txt:/app/requirements.txt
    working_dir: /app
    command: >
      sh -c "
              pip install -r requirements.txt &&
              python seed.py
            "

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter
    container_name: pg_exporter
    networks:
      - app-network
    restart: always
    depends_on:
      haproxy:
        condition: service_started
    environment:
      DATA_SOURCE_NAME: "postgresql://${DB_ADMIN_USER}:${DB_ADMIN_PASSWORD}@haproxy:5000/${DB_NAME}?sslmode=disable"
    ports:
      - "9187:9187"

  simulator:
    image: python:3.10-slim
    container_name: query-simulator
    networks:
      - app-network
    restart: always
    env_file:
      - .env
    depends_on:
      haproxy:
        condition: service_started
    volumes:
      - ./simulator:/app
    working_dir: /app
    ports:
      - "8000:8000"
    command: >
      sh -c "
        pip install -r requirements.txt &&
        python app.py
      "

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    networks:
      - app-network
    volumes:
      - ./prometheus:/etc/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    ports:
      - "9090:9090"
    depends_on:
      - postgres-exporter
      - simulator

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    networks:
      - app-network
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

  db_backup:
    image: python:3.10-alpine
    container_name: db_backup
    networks:
      - app-network
    restart: always
    depends_on:
      haproxy:
        condition: service_started
    env_file:
      - .env
    environment:
      BACKUP_INTERVAL_CRON: ${BACKUP_INTERVAL_CRON:-"*/5 * * * *"}
      BACKUP_RETENTION_COUNT: ${BACKUP_RETENTION_COUNT:-5}
      PGHOST: haproxy
      PGPORT: "5000"
      PGUSER: ${DB_ADMIN_USER}
      PGPASSWORD: ${DB_ADMIN_PASSWORD}
      DB_NAME: ${DB_NAME}
    volumes:
      - ./backup:/app
      - ./backups:/backups
    working_dir: /app
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        echo "Installing dependencies..."
        apk update && \
        apk add --no-cache python3 py3-pip postgresql-client cronie bash tzdata busybox-suid
        echo "Setting up cron schedule: $BACKUP_INTERVAL_CRON"
        # Запишем cron-задачу в системный crontab
        echo "$BACKUP_INTERVAL_CRON root python3 /app/backup.py >> /var/log/backup.log 2>&1" \
          > /etc/crontabs/root
        # Удостоверьтесь, что папка для логов существует
        mkdir -p /var/log
        touch /var/log/backup.log
        echo "Starting crond in foreground..."
        crond -f

volumes:
  pgdata:
  grafana_data:

networks:
  app-network:
    driver: bridge
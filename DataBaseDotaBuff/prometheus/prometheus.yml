global:
  scrape_interval: 5s

scrape_configs:
  - job_name: 'postgres_exporter'
    metrics_path: /metrics
    static_configs:
      - targets: ['postgres-exporter:9187']
        labels:
          service: postgres

  - job_name: 'query_simulator'
    metrics_path: /metrics
    static_configs:
      - targets: ['simulator:8000']
        labels:
          service: simulator